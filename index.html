<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediScan AI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #07111f; color: #e8f0fb; }
    main { max-width: 1000px; margin: auto; padding: 48px 20px; }
    h1 { margin-bottom: 8px; color: #69b8ff; }
    .card { background: #101f33; border: 1px solid #26415f; border-radius: 14px; padding: 24px; margin-top: 24px; }
    input, button { font: inherit; }
    button { background: #1683d8; border: 0; border-radius: 8px; color: white; cursor: pointer; padding: 12px 18px; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { margin-top: 16px; color: #9cc9ec; }
    #result { white-space: pre-wrap; line-height: 1.55; }
    .warning { color: #ffd27d; }
  </style>
</head>
<body>
  <main>
    <h1>MediScan AI</h1>
    <p>Medicine identification and pharmaceutical information assistant.</p>
    <p class="warning">Informational use only. Always verify medicines with a licensed pharmacist or physician.</p>
    <section class="card">
      <label for="image">Upload a medicine package or blister image</label>
      <p><input id="image" type="file" accept="image/jpeg,image/png,image/webp"></p>
      <button id="analyze" type="button">Analyze medicine</button>
      <div id="status" role="status">Ready for an image.</div>
    </section>
    <section id="result" class="card" hidden></section>
  </main>
  <script>
    const input = document.getElementById("image");
    const button = document.getElementById("analyze");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    button.addEventListener("click", async () => {
      if (!input.files[0]) { status.textContent = "Choose an image first."; return; }
      button.disabled = true;
      status.textContent = "Analyzing...";
      result.hidden = true;
      try {
        const reader = new FileReader();
        const dataUrl = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(input.files[0]);
        });
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: dataUrl })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Analysis failed.");
        result.textContent = data.report;
        result.hidden = false;
        status.textContent = "Analysis complete.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
